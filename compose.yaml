services:
  db:
    build:
      context: ./database
    env_file: .env
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # TCP on purpose: during first-run init the temporary server only listens on
      # the Unix socket, so this stays unhealthy until the data load has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  server:
    build:
      context: ./server
    env_file: .env
    environment:
      # Local stack is plain http; production keeps Secure cookies.
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "${SERVER_HOST_PORT:-8080}:8080"
    extra_hosts:
      # Lets the OCR modules reach a model server running on the host machine.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./app
      args:
        # Browser -> web:3000/api/* -> server:8080/api/* (same origin, so the session cookie is first-party).
        API_INTERNAL_URL: http://server:8080
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db-data:
